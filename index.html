<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moto KM</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moto KM">
<meta name="theme-color" content="#0E1114">
<link rel="manifest" href="manifest.webmanifest">
<script>
// Aparência escolhida em Ajustes, aplicada antes de desenhar a tela (sem piscar o tema errado).
try { var t = (JSON.parse(localStorage.getItem('motokm:v1')) || {}).settings?.tema;
  if (t === 'claro' || t === 'escuro') document.documentElement.dataset.theme = t === 'claro' ? 'light' : 'dark'; } catch (e) {}
</script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Painel de moto elétrica: grafite de base, verde-lima para a ação principal e a carga,
   âmbar para perigos. Números grandes em cima, abas embaixo, uma coluna. */
:root{
  --bg:#E9ECEF; --panel:#FFFFFF; --fg:#14171A; --muted:#58616B; --line:#D3D8DD;
  --accent:#9BDB2C; --accent-ink:#0F1405; --accent-txt:#3F6212;   /* lima: botão principal; texto lima legível no claro */
  --ok:#4D7C0F; --low:#C2362B; --haz:#D97706; --haz-ink:#1A1003; --seg-off:#D7DCE1;
  --route:#3F6212; --hero:#1B1F24; --hero-fg:#F2F5F7; --hero-muted:#9AA4AE; --hero-line:#2C333B;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
/* Escuro: no modo Sistema segue o aparelho; Claro/Escuro em Ajustes fixam o tema (data-theme). */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101215; --panel:#1A1E23; --fg:#EDF0F2; --muted:#8F99A3; --line:#2A3038;
  --accent:#B6F04A; --accent-ink:#0F1405; --accent-txt:#B6F04A;
  --ok:#A3E635; --low:#FF6B5E; --haz:#F5A524; --haz-ink:#1A1003; --seg-off:#2B3139;
  --route:#B6F04A; --hero:#1A1E23; --hero-fg:#EDF0F2; --hero-muted:#8F99A3; --hero-line:#2A3038;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101215; --panel:#1A1E23; --fg:#EDF0F2; --muted:#8F99A3; --line:#2A3038;
  --accent:#B6F04A; --accent-ink:#0F1405; --accent-txt:#B6F04A;
  --ok:#A3E635; --low:#FF6B5E; --haz:#F5A524; --haz-ink:#1A1003; --seg-off:#2B3139;
  --route:#B6F04A; --hero:#1A1E23; --hero-fg:#EDF0F2; --hero-muted:#8F99A3; --hero-line:#2A3038;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:28px}
h2{font-size:20px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .num{font-size:30px;line-height:1}
.stat .unit{font-size:15px;color:var(--muted);margin-left:2px;font-family:var(--body);font-weight:500}
button,.btn{font:600 16px var(--body);border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--seg-off);color:var(--fg);
  min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.danger{background:transparent;color:var(--low);border:1px solid var(--low)}
button.ghost{background:transparent;border:1px solid var(--line)}
button.block{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:500 16px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-height:46px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}

/* Velocímetro da viagem */
.gauge{text-align:center;padding-block:8px}
.gauge .speed{font-size:112px;line-height:.9}
.gauge .speed-unit{font-size:16px;color:var(--muted)}
.gps{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--low)}

/* Bateria de 5 tracinhos, igual ao painel */
.battery{display:flex;gap:6px;align-items:flex-end}
.seg{flex:1;height:44px;border-radius:6px;background:var(--seg-off);border:0;padding:0;min-height:0}
.seg.on{background:var(--ok)}
.battery.low .seg.on{background:var(--low)}
.battery.picker .seg{cursor:pointer}
.battery.mini{gap:3px;width:62px}
.battery.mini .seg{height:12px;border-radius:2px}

/* Gráfico */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font:500 10px var(--body)}
.chart text.val{fill:var(--fg);font-weight:600}
.seg-ctl{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg-ctl button{flex:1;min-height:36px;padding:6px 10px;font-size:14px;background:transparent;border-radius:8px}
.seg-ctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}

/* Lista de viagens */
.trips{display:flex;flex-direction:column}
.trip{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.trip:first-child{border-top:0}
.trip svg{width:52px;height:40px}
.trip svg path{fill:none;stroke:var(--route);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trip .km{font-size:24px}
.trip .x{background:transparent;color:var(--muted);min-height:36px;padding:6px 10px;font-size:20px}

/* Abas */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav .tabs{display:flex;width:100%;max-width:560px}
nav button{flex:1;min-width:0;flex-direction:column;gap:2px;background:transparent;border-radius:0;font-size:11px;font-weight:600;color:var(--muted);padding:10px 2px;min-height:60px;letter-spacing:-.01em}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent-txt)}

/* Janela de baixo */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:14px;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:90vw;text-align:center}
.empty{text-align:center;padding:24px 8px;display:flex;flex-direction:column;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}

/* Painel escuro de destaque (início, viagem e resumo): grafite nos dois temas */
.hero{background:var(--hero);color:var(--hero-fg);border-color:var(--hero-line)}
.hero .label,.hero .muted,.hero .unit{color:var(--hero-muted)}
.hero .seg:not(.on){background:#2B3139}
.hero .battery:not(.low) .seg.on{background:#A3E635}
.big{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:.85;letter-spacing:-.01em}
.big .unit{font-size:.28em;font-weight:600;letter-spacing:.02em;margin-left:6px}
button.go{min-height:64px;font:700 26px var(--display);letter-spacing:.04em;text-transform:uppercase;border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--seg-off);color:var(--fg)}
.hero .pill{background:#2B3139;color:var(--hero-fg)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--hero-line);padding-top:12px}
.kpis .num{font-size:30px;line-height:1}
.ride{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.ride svg{width:64px;height:50px}
.ride .unit{margin-left:4px}
.ride svg path,.route-big path{fill:none;stroke:var(--route);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.hero .route-big path{stroke:#B6F04A;stroke-width:4}
.route-big{display:block;width:100%;height:auto;max-height:240px;aspect-ratio:52/40;background:#14171B;border-radius:12px;padding:12px}
.batt-flow{display:flex;align-items:center;gap:10px}
.batt-flow .battery.mini{width:76px}
.linkbtn{background:transparent;color:var(--muted);min-height:44px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.done-badge{display:inline-flex;align-items:center;gap:8px;color:var(--accent-txt);font:700 15px var(--body);text-transform:uppercase;letter-spacing:.08em}
.hero .done-badge{color:#B6F04A}
@media (prefers-reduced-motion:no-preference){.appear{animation:appear .25s ease-out}
  @keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
/* Mapa e perigos */
.map-panel{padding:0;overflow:hidden;isolation:isolate;position:relative;z-index:0}
#map{height:56vh;min-height:320px;background:var(--seg-off)}
.map-msg{height:56vh;min-height:320px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.hz-pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff}
.hz-pin span{transform:rotate(45deg);font-size:17px;line-height:1}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2563EB;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
.hz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hz-grid button{flex-direction:column;gap:4px;min-height:84px;padding:10px 6px;font-size:13px;background:var(--bg);border:1px solid var(--line)}
.hz-grid button .ic{font-size:28px;line-height:1}
button.warn{background:var(--haz);color:var(--haz-ink)}
.hz-item{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;padding-block:12px;border-top:1px solid var(--line)}
.hz-item:first-child{border-top:0}
.hz-item .ic{font-size:26px;line-height:1.2;text-align:center}
.hz-item .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.hz-item .acts button,.leaflet-popup-content button{min-height:36px;padding:6px 12px;font-size:13px}
.leaflet-popup-content{font:14px/1.4 var(--body);margin:12px 14px}
.leaflet-popup-content .acts{display:flex;gap:6px;margin-top:8px}
.trip[data-trip]{cursor:pointer}
.map-info{display:flex;align-items:center;gap:6px;margin:0 8px 8px 0}
.map-info button{width:26px;height:26px;min-height:0;padding:0;border-radius:50%;font:700 14px/1 Georgia,serif;font-style:italic;
  background:rgba(255,255,255,.85);color:#333;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.map-info span{background:rgba(255,255,255,.9);color:#333;font-size:11px;padding:4px 8px;border-radius:8px}
.map-info a{color:#1d4ed8}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
/* Comunidade: feed, publicar e mensagens (modo de teste, dados só no aparelho) */
.avatar{flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 15px var(--display);color:#0F1405;background:var(--c,#B6F04A)}
.tag-test{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;
  border:1px dashed var(--muted);color:var(--muted);vertical-align:2px;margin-left:6px}
button.chip{min-height:40px;padding:4px 10px 4px 4px;border-radius:999px;font-size:14px;background:var(--panel);border:1px solid var(--line);gap:8px}
button.iconbtn{position:relative;min-height:44px;width:44px;padding:0;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
.iconbtn svg,.post-acts svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--low);color:#fff;font:700 11px/20px var(--body);padding:0 5px;text-align:center}
nav button .tab-dot{position:absolute;top:8px;margin-left:22px;width:9px;height:9px;border-radius:50%;background:var(--low)}
nav button{position:relative}
.post{padding:0;gap:0;overflow:hidden}
.post-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px}
.post-head .who{flex:1;min-width:0;line-height:1.25}
.post-head .x{background:transparent;color:var(--muted);min-height:36px;padding:6px 10px;font-size:20px}
.post-photo{display:block;width:100%;height:auto;max-height:560px;object-fit:cover;background:var(--seg-off)}
.post-photo:not([src]){aspect-ratio:4/3}
.post-route{position:relative;display:block;width:100%;padding:0;border-radius:0;background:#14171B;color:#F2F5F7;min-height:0;text-align:left}
.post-photo + .post-route{border-top:1px solid #2C333B}
.post-route svg{display:block;width:100%;height:auto;max-height:260px;aspect-ratio:52/36;padding:14px 18px 54px}
.post-route svg path{fill:none;stroke:#B6F04A;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.post-route .km{position:absolute;left:14px;bottom:10px;font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.post-route .km small{font-size:15px;font-weight:600;margin-left:3px;color:#9AA4AE}
.post-route .meta{position:absolute;right:14px;bottom:14px;font-size:12px;color:#9AA4AE;text-align:right}
.post-route.no-route{padding:16px 14px 56px}
.post-acts{display:flex;align-items:center;gap:4px;padding:6px 6px 0}
.post-acts button{background:transparent;min-height:44px;padding:8px 10px;font-size:15px;gap:6px;color:var(--fg)}
.post-acts button.like[aria-pressed="true"]{color:var(--low)}
.post-acts button.like[aria-pressed="true"] svg{fill:currentColor}
.post-acts button:disabled{opacity:.45;cursor:default}
.post-cap{margin:0;padding:2px 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.post-cap:empty{display:none}
.pick-list{display:flex;flex-direction:column;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.pick-list label{display:grid;grid-template-columns:22px 52px 1fr;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.pick-list label:first-child{border-top:0}
.pick-list input{width:20px;height:20px;min-height:0;accent-color:var(--accent);margin:0}
.pick-list svg{width:52px;height:40px}
.pick-list svg path{fill:none;stroke:var(--route);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
textarea{font:400 16px/1.4 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-height:84px;resize:vertical}
.photo-pick{display:flex;gap:10px;align-items:center}
.photo-pick img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.conv{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);
  background:transparent;border-radius:0;min-height:0;text-align:left;font-weight:400;width:100%}
.conv:first-child{border-top:0}
.conv .prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.unread .prev{color:var(--fg);font-weight:600}
.chat{display:flex;flex-direction:column;gap:6px;padding-bottom:84px}
.bub{max-width:78%;padding:9px 12px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub time{display:block;font-size:11px;opacity:.65;margin-top:2px}
.chat-bar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bg);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.chat-bar form{display:flex;gap:8px;width:100%;max-width:528px}
.chat-bar input{border-radius:999px}
.chat-bar button{border-radius:999px;padding:10px 16px}
.back{background:transparent;min-height:44px;padding:6px 8px 6px 0;font-size:16px;color:var(--accent-txt)}
@media (max-height:700px){.big{font-size:72px!important}.hero{gap:8px!important;padding:14px}.kpis{padding-top:8px}
  .kpis .num{font-size:26px}button.go{min-height:56px;font-size:23px}main{gap:12px;padding-top:10px}h1{font-size:25px}}
@media (max-width:360px){.gauge .speed{font-size:88px}.grid3{grid-template-columns:1fr 1fr}.big{font-size:84px!important}.kpis .num{font-size:26px}}
@media (prefers-reduced-motion:no-preference){button{transition:transform .08s}button:active{transform:scale(.97)}}
</style>
</head>
<body>
<main id="app"></main>
<nav><div class="tabs" id="tabs"></div></nav>
<div id="layer"></div>

<script src="community-store.js"></script>
<script>
'use strict';
/* ---------- Dados ---------- */
const APP_VERSION = '1.1.0'; // gravada por "npm run version:sync" a partir do package.json; não editar à mão
const KEY = 'motokm:v1';
// A viagem em andamento também fica numa chave própria, pequena, gravada a cada ponto do GPS.
// Se o iPhone fechar o app sem aviso, ela volta com os pontos já gravados.
const KEY_ATIVA = KEY + ':ativa';
const DEF = {
  settings: { preco: 0.90, ah: 20, volts: 60, efic: 0.85, odo: 0, tracos: 5, kwCarregador: 0.2, autonomiaFab: 40, tema: 'sistema' },
  trips: [], charges: [], hazards: [], active: null
};
let S = load();
let summaryId = null; // viagem recém-salva: mostra o resumo na aba Viagem até fechar
saveActive(); // deixa a cópia da viagem em andamento igual ao que foi carregado (apaga cópia velha)
let tab = 'viagem';
let chartMode = 'dias';

function load() {
  let st = JSON.parse(JSON.stringify(DEF));
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r) st = { ...st, ...r, settings: { ...DEF.settings, ...(r.settings || {}) } };
  } catch (e) {}
  st.active = recoverActive(st);
  return st;
}
// Só aproveita a cópia da viagem em andamento se o histórico disser que essa mesma viagem
// (mesmo início) ainda não terminou. Assim uma viagem já salva nunca volta.
function recoverActive(st) {
  let a = null;

  const cur = st.active;

}

}

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n, d = 1) => (n == null || !isFinite(n)) ? '–' : n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const brl = n => (n == null || !isFinite(n)) ? '–' : n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dur = sec => { sec = Math.round(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}h${String(m).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`; };
const durMin = sec => { const m = Math.max(1, Math.round((sec || 0) / 60)), h = Math.floor(m / 60);
  return h ? `${h}h${String(m % 60).padStart(2, '0')}` : `${m} min`; };
const dia = t => new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
const hora = t => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };

function dist(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

let toastT;
function toast(msg) {
  clearTimeout(toastT);
  $('#layer').querySelector('.toast')?.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  $('#layer').appendChild(el);
  toastT = setTimeout(() => el.remove(), 2800);
}

/* ---------- Bateria ---------- */
function batteryHTML(n, { picker = false, mini = false, name = '' } = {}) {
  const t = S.settings.tracos; let h = '';
  for (let i = 1; i <= t; i++) {
    const on = n != null && i <= n ? ' on' : '';

      ? `<button type="button" class="seg${on}" data-pick="${name}" data-v="${i}" aria-label="${i} de ${t} tracinhos"></button>`
      : `<span class="seg${on}"></span>`;
  }
  const low = n != null && n <= 1 ? ' low' : '';
  return `<div class="battery${picker ? ' picker' : ''}${mini ? ' mini' : ''}${low}" ${picker ? `role="group" aria-label="Bateria"` : `aria-label="${n ?? '?'} de ${t} tracinhos"`}>${h}</div>`;
}
function bindPickers(root, onPick) {
  root.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const name = b.dataset.pick, v = +b.dataset.v;
    root.querySelectorAll(`[data-pick="${name}"]`).forEach(s => s.classList.toggle('on', +s.dataset.v <= v));
    s_low(root, name, v);
    onPick(name, v);
  });
}
function s_low(root, name, v) {
  const g = root.querySelector(`[data-pick="${name}"]`)?.parentElement;
  if (g) g.classList.toggle('low', v <= 1);
}

/* ---------- Cálculos ---------- */
function stats(trips) {
  let km = 0, sec = 0, dash = 0, kmDash = 0;
  for (const t of trips) {
    km += t.km; sec += t.movingSec || 0;
    if (t.dashStart != null && t.dashEnd != null && t.dashStart > t.dashEnd) { dash += t.dashStart - t.dashEnd; kmDash += t.km; }
  }
  const s = S.settings, whBat = s.volts * s.ah;
  const ok = dash >= 2 && kmDash > 0;
  const kmPorTraco = ok ? kmDash / dash : null;
  const whKm = ok ? (dash / s.tracos * whBat) / kmDash : null;
  const custoKm = whKm ? whKm / 1000 / s.efic * s.preco : null;
  return { km, sec, n: trips.length, dash, kmPorTraco, whKm, custoKm, autonomia: kmPorTraco ? kmPorTraco * s.tracos : null };
}
// Autonomia de uma carga cheia: usa a medida nas viagens; sem dados, usa a de fábrica (Ajustes).
function autonomia() {
  const st = stats(S.trips);
  return st.autonomia ? { km: st.autonomia, real: true } : { km: S.settings.autonomiaFab || 0, real: false };
}
// Quanto ainda dá para rodar, partindo dos tracinhos da saída e descontando o que já rodou.
function kmRestante(A) {
  const a = autonomia(); if (!a.km || A.dashStart == null) return null;
  return Math.max(0, A.dashStart / S.settings.tracos * a.km - A.m / 1000);
}
function chargeKwh(c) {
  const s = S.settings;
  if (c.hours) return c.hours * s.kwCarregador;
  return (s.tracos - (c.dashFrom ?? 0)) / s.tracos * s.volts * s.ah / 1000 / s.efic;
}
function inPeriod(list, from) { return list.filter(x => (x.start ?? x.date) >= from); }
function monthStart() { const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); return d.getTime(); }

/* ---------- GPS ---------- */
// No app do iPhone (Capacitor) o GPS nativo continua com a tela bloqueada, igual ao Strava.
// No site (PWA) o iOS pausa o GPS quando a tela apaga; aí o trecho perdido é estimado em linha reta.
const CAP = window.Capacitor;
const NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const BG = NATIVE ? (typeof CAP.registerPlugin === 'function' ? CAP.registerPlugin('BackgroundGeolocation') : CAP.Plugins?.BackgroundGeolocation) : null;
let watchId = null, watchToken = 0, wake = null, ticker = null, lastSave = 0;

function startTrip(dash) {
  S.active = { start: Date.now(), dashStart: dash, m: 0, movingMs: 0, maxKmh: 0, last: null, lastT: null, route: [], speed: 0, acc: null, gps: 'aguardando' };
  save(); tab = 'viagem'; render(); window.scrollTo(0, 0);
  // Mostra a tela da viagem já; liga o GPS no quadro seguinte, para o iPhone não segurar a tela enquanto o GPS nativo acorda.
  setTimeout(beginWatch, 30);
}
function beginWatch() {
  if (!S.active) return;
  if (!S.active.pausedAt) {                       // pausada: GPS desligado, só o relógio continua
    try { startGps(); } catch (e) { toast('Não consegui ligar o GPS'); }
    requestWake();
  }
  clearInterval(ticker); ticker = setInterval(renderLive, 1000);
  renderLive();
}
function startGps() {
  clearGps();
  if (BG) {
    const token = ++watchToken;
    BG.addWatcher({
      backgroundMessage: 'Medindo a viagem', backgroundTitle: 'Moto KM',
      requestPermissions: true, stale: false, distanceFilter: 0
    }, (loc, err) => {
      if (token !== watchToken) return;
      if (err) { onErr({ code: err.code === 'NOT_AUTHORIZED' ? 1 : 2 }); return; }
      if (loc) onPos({ coords: { latitude: loc.latitude, longitude: loc.longitude, accuracy: loc.accuracy, speed: loc.speed }, timestamp: loc.time || Date.now() });
    }).then(id => { if (token === watchToken) watchId = id; else BG.removeWatcher({ id }).catch(() => {}); })
      .catch(() => { toast('Não consegui ligar o GPS'); });
  } else if ('geolocation' in navigator) {
    watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  } else toast('Este navegador não tem acesso ao GPS');
}
function clearGps() {
  watchToken++;
  if (watchId != null) {
    if (BG) BG.removeWatcher({ id: watchId }).catch(() => {});
    else navigator.geolocation.clearWatch(watchId);
  }
  watchId = null;
}
function stopWatch() {
  clearGps(); clearInterval(ticker); ticker = null;
  try { wake?.release(); } catch (e) {} wake = null;
}
async function requestWake() {
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.active) { requestWake(); renderLive(); }
  if (document.visibilityState === 'hidden' && S.active) save(); // guarda antes do iOS pausar ou fechar o app
});

function onErr(e) {
  if (!S.active) return;
  S.active.gps = e.code === 1 ? 'negado' : 'sem sinal';
  renderLive();
}
// Pausa: desliga o GPS e guarda quando começou. O tempo pausado fica fora do tempo da viagem
// e, ao retomar, o primeiro ponto recomeça a medição (não soma o caminho feito durante a pausa).
function pauseTrip() {
  const A = S.active; if (!A || A.pausedAt) return;
  A.pausedAt = Date.now(); A.speed = 0;
  clearGps(); try { wake?.release(); } catch (e) {} wake = null;
  save(); render(); toast('Rolê pausado');
}
function resumeTrip() {
  const A = S.active; if (!A || !A.pausedAt) return;
  A.pausedMs = (A.pausedMs || 0) + Math.max(0, Date.now() - A.pausedAt);
  A.pausedAt = null; A.last = null; A.lastT = null; A.gps = 'aguardando';
  save(); render(); setTimeout(beginWatch, 30); toast('Bora de novo');
}
const pausedMs = (A, now = Date.now()) => (A.pausedMs || 0) + (A.pausedAt ? Math.max(0, now - A.pausedAt) : 0);

function onPos(p) {
  const A = S.active; if (!A || A.pausedAt) return;
  const c = p.coords, t = p.timestamp;
  A.acc = Math.round(c.accuracy);
  if (c.accuracy > 30) { A.gps = 'fraco'; renderLive(); return; }
  A.gps = 'ok';
  const pt = [c.latitude, c.longitude];
  if (!A.last) { A.last = pt; A.lastT = t; pushRoute(A, pt); checkHazards(pt); persist(); renderLive(); return; }

  const d = dist(A.last, pt), dt = (t - A.lastT) / 1000;
  if (dt <= 0) return;
  const vCalc = d / dt * 3.6;
  const gap = dt > 30;                           // GPS ficou parado (tela bloqueada no site ou app fechado)
  const v = gap ? 0 : (c.speed != null && c.speed >= 0) ? c.speed * 3.6 : vCalc;
  if (vCalc > 100) return;                       // salto do GPS, ignora
  if (d < Math.max(4, c.accuracy * 0.4)) {       // parado ou tremida do GPS
    A.speed = v < 3 ? 0 : v; renderLive(); return;
  }
  A.m += d;
  if (gap) {                                     // soma o trecho perdido em linha reta
    if (vCalc > 5) A.movingMs += dt * 1000;
    A.estM = (A.estM || 0) + d;
    if (d >= 100) toast(`GPS ficou pausado ${dur(dt)}: somei ${fmt(d / 1000, 2)} km em linha reta`);
  } else if (vCalc > 2) A.movingMs += dt * 1000;
  A.maxKmh = Math.max(A.maxKmh, Math.min(v, 100));
  A.speed = v; A.last = pt; A.lastT = t;
  pushRoute(A, pt); checkHazards(pt); persist(); renderLive();
}
function pushRoute(A, pt) {
  const r = A.route, p = [+pt[0].toFixed(5), +pt[1].toFixed(5)];
  if (!r.length || dist(r[r.length - 1], p) >= 15) r.push(p);
  if (r.length > 1500) A.route = r.filter((_, i) => i % 2 === 0 || i === r.length - 1);
}
function persist() {
  saveActive();                                   // a cada ponto: só a viagem em andamento, rápido
  const n = Date.now(); if (n - lastSave > 5000) { lastSave = n; save(); }
}

function finishTrip(dashEnd) {
  const A = S.active; if (!A) return;
  stopWatch();
  const trip = { id: Date.now(), start: A.start, end: Date.now(), km: A.m / 1000, movingSec: A.movingMs / 1000,
    maxKmh: A.maxKmh, dashStart: A.dashStart, dashEnd, route: A.route, estKm: (A.estM || 0) / 1000 };
  const pms = pausedMs(A, trip.end); if (pms) trip.pausedSec = pms / 1000;
  S.active = null;
  if (S.trips.some(t => t.start === trip.start)) toast('Esta viagem já estava salva');
  else if (trip.km >= 0.05) { S.trips.push(trip); summaryId = trip.id; toast('Rolê salvo'); }
  else toast('Viagem muito curta, não foi salva');
  save(); render();
}
function cancelTrip() { stopWatch(); S.active = null; save(); render(); toast('Viagem descartada'); }

/* ---------- Perigos no caminho ---------- */
// Tipos de aviso e por quanto tempo valem sem ninguém confirmar.
const HZ = {
  fio:        { name: 'Fio caído',    ic: '⚡', c: '#DC2626', h: 24 },
  buraco:     { name: 'Buraco',       ic: '🕳️', c: '#B45309', h: 24 * 30 },
  alagamento: { name: 'Alagamento',   ic: '🌊', c: '#2563EB', h: 12 },
  obra:       { name: 'Obra',         ic: '🚧', c: '#CA8A04', h: 24 * 14 },
  acidente:   { name: 'Acidente',     ic: '💥', c: '#7C3AED', h: 6 },
  outro:      { name: 'Outro perigo', ic: '⚠️', c: '#475569', h: 24 * 3 }
};
const ALERT_M = 200; // avisa quando chega a 200 m de um perigo
const hzActive = () => S.hazards.filter(h => !h.gone && Date.now() < (h.seen || h.date) + (HZ[h.type]?.h || 24) * 3600e3);
const ago = t => { const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'agora' : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.round(m / 60)} h` : `há ${Math.round(m / 1440)} dias`; };
const metros = m => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${fmt(m / 1000, 1)} km`;

function addHazard(type, lat, lon, note) {
  const h = { id: Date.now(), type, lat: +lat.toFixed(6), lon: +lon.toFixed(6), date: Date.now(), seen: Date.now(), note: note || '', confirms: 0, mine: true };
  S.hazards.push(h); save();
  toast(`${HZ[type].ic} ${HZ[type].name} marcado no mapa`);
  return h;
}
function hazardStill(id) { const h = S.hazards.find(x => x.id === id); if (h) { h.seen = Date.now(); h.confirms = (h.confirms || 0) + 1; save(); toast('Obrigado! Aviso renovado'); } }
function hazardGone(id) { const h = S.hazards.find(x => x.id === id); if (h) { h.gone = Date.now(); save(); toast('Aviso retirado do mapa'); } }

// Durante a viagem: avisa uma vez por perigo quando chega perto.
function checkHazards(pt) {
  const A = S.active; if (!A) return;
  A.alerted = A.alerted || [];
  for (const h of hzActive()) {
    if (A.alerted.includes(h.id)) continue;
    const d = dist(pt, [h.lat, h.lon]);
    if (d > ALERT_M) continue;
    A.alerted.push(h.id);
    const t = HZ[h.type];
    toast(`${t.ic} Atenção: ${t.name.toLowerCase()} a ${metros(d)}`);
    try { navigator.vibrate?.([300, 120, 300]); } catch (e) {}
    try {
      const u = new SpeechSynthesisUtterance(`Atenção: ${t.name} a ${Math.round(d / 10) * 10} metros`);
      u.lang = 'pt-BR'; speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  }
}

// Onde estou agora (usa o GPS da viagem se estiver rodando).
function hereNow() {
  const A = S.active;
  if (A?.last && A.lastT && Date.now() - A.lastT < 60000) return Promise.resolve({ lat: A.last[0], lon: A.last[1], acc: A.acc });
  return new Promise((ok, no) => {
    if (!('geolocation' in navigator)) return no(new Error('sem gps'));
    navigator.geolocation.getCurrentPosition(p => ok({ lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
      no, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  });
}

// Janela de aviso: um toque no tipo já salva (pensado para usar na moto).
function reportSheet(at) {
  sheet(`<h2>Avisar perigo</h2>
    <span class="small muted" id="hzWhere">${at ? 'No ponto escolhido no mapa' : 'Procurando sua localização…'}</span>
    <div class="hz-grid">${Object.entries(HZ).map(([k, t]) => `<button type="button" data-hz="${k}"><span class="ic">${t.ic}</span>${t.name}</button>`).join('')}</div>
    <div class="field"><label class="label" for="hzNote">Detalhe (opcional)</label><input id="hzNote" maxlength="120" placeholder="Ex.: fio no meio da rua, perto do mercado"></div>
    <button class="ghost block" data-x>Cancelar</button>`,
    (el, close) => {
      let pos = at || null;
      if (!pos) hereNow().then(p => { pos = p; const w = el.querySelector('#hzWhere'); if (w) w.textContent = `No seu local atual (±${p.acc} m)`; })
        .catch(() => { const w = el.querySelector('#hzWhere'); if (w) w.textContent = 'Não achei o GPS. No mapa, segure o dedo no local para marcar.'; });
      el.querySelector('[data-x]').onclick = close;
      el.querySelectorAll('[data-hz]').forEach(b => b.onclick = () => {
        if (!pos) { toast('Ainda procurando o GPS…'); return; }
        addHazard(b.dataset.hz, pos.lat, pos.lon, el.querySelector('#hzNote').value.trim());
        close(); if (tab === 'mapa') render();
      });
    });
}

/* ---------- Mapa (Leaflet + OpenStreetMap, carregado só quando abre a aba) ---------- */
let leafletP = null, mapObj = null, mapFocus = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  // A biblioteca do mapa vem junto com o app (vendor/), não depende de CDN.
  const add = (tag, attrs) => new Promise((ok, no) => {
    const el = Object.assign(document.createElement(tag), attrs); el.onload = ok; el.onerror = () => { el.remove(); no(); };
    document.head.appendChild(el);
  });
  return leafletP || (leafletP = Promise.all([
    add('link', { rel: 'stylesheet', href: 'vendor/leaflet/leaflet.css' }),
    add('link', { rel: 'stylesheet', href: 'vendor/maplibre/maplibre-gl.css' }),
    add('script', { src: 'vendor/leaflet/leaflet.js' })
      .then(() => add('script', { src: 'vendor/maplibre/maplibre-gl.js' }))
      .then(() => add('script', { src: 'vendor/maplibre/leaflet-maplibre-gl.js' }))
      .catch(() => { if (!window.L) throw new Error('leaflet'); }) // sem MapLibre, usa o mapa simples
  ]).catch(e => { leafletP = null; throw e; }));
}
function hzIcon(h) {
  const t = HZ[h.type] || HZ.outro;
  return L.divIcon({ className: '', html: `<div class="hz-pin" style="--c:${t.c}"><span>${t.ic}</span></div>`, iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -30] });
}
function hzPopup(h) {
  const t = HZ[h.type] || HZ.outro;
  return `<strong>${t.ic} ${t.name}</strong><div class="muted small">Marcado ${ago(h.date)}${h.confirms ? ` · confirmado ${h.confirms}x` : ''}</div>
    ${h.note ? `<div>${esc(h.note)}</div>` : ''}
    <div class="acts"><button type="button" data-hz-ok="${h.id}">Ainda está lá</button><button type="button" class="ghost" data-hz-gone="${h.id}">Não está mais</button></div>`;
}
function initMap() {
  const box = $('#map'); if (!box) return;
  loadLeaflet().then(() => {
    if (tab !== 'mapa' || !document.body.contains(box)) return;
    const dark = isDark();
    mapObj = L.map(box, { zoomControl: true, attributionControl: false }).setView([-15.8, -47.9], 4);
    // Créditos do mapa (exigidos pela licença do OpenStreetMap) num botão "i" pequeno.
    const Info = L.Control.extend({ options: { position: 'bottomright' }, onAdd() {
      const d = L.DomUtil.create('div', 'map-info');
      d.innerHTML = '<span hidden>© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> · <a href="https://openfreemap.org" target="_blank">OpenFreeMap</a></span><button type="button" aria-label="Créditos do mapa">i</button>';
      L.DomEvent.disableClickPropagation(d);
      d.querySelector('button').onclick = () => { const t = d.querySelector('span'); t.hidden = !t.hidden; };
      return d;
    } });
    new Info().addTo(mapObj);
    // Mapa da OpenFreeMap: grátis e sem chave (funciona dentro do app do iPhone).
    // Se o celular não tiver WebGL ou o mapa não carregar, usa os quadros do OpenStreetMap.
    const OSM_ATTR = '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
    const useOsm = () => { if (mapObj && !mapObj._osm) { mapObj._osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: OSM_ATTR }).addTo(mapObj); } };
    let gl = null;
    try {
      const webgl = (() => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { return false; } })();
      if (!L.maplibreGL || !window.maplibregl || !webgl) throw 0;
      const style = n => `https://tiles.openfreemap.org/styles/${n}`;
      gl = L.maplibreGL({ style: style(dark ? 'dark' : 'liberty') }).addTo(mapObj);
      const m = gl.getMaplibreMap();
      let loaded = false, triedLight = !dark;
      m.on('load', () => { loaded = true; });
      m.on('error', () => {
        if (loaded || !mapObj) return;
        if (!triedLight) { triedLight = true; m.setStyle(style('liberty')); return; }
        mapObj.removeLayer(gl); gl = null; useOsm();
      });
    } catch (e) { if (gl) mapObj.removeLayer(gl); useOsm(); }
    setTimeout(() => mapObj?.invalidateSize(), 300);

    const bounds = [];
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#B45309';
    for (const t of S.trips) {
      if (!t.route || t.route.length < 2) continue;
      const on = mapFocus === t.id;
      const line = L.polyline(t.route, { color: on ? '#2563EB' : accent, weight: on ? 6 : 4, opacity: mapFocus && !on ? 0.35 : 0.85 }).addTo(mapObj);
      line.bindPopup(`<strong>${fmt(t.km, 2)} km</strong><div class="muted small">${dia(t.start)} · ${hora(t.start)}${t.movingSec ? ` · ${dur(t.movingSec)}` : ''}</div>`);
      if (on) bounds.push(...t.route);
    }
    if (S.active?.route?.length > 1) L.polyline(S.active.route, { color: '#2563EB', weight: 6 }).addTo(mapObj);
    for (const h of hzActive()) L.marker([h.lat, h.lon], { icon: hzIcon(h) }).addTo(mapObj).bindPopup(hzPopup(h));

    // Segurar o dedo no mapa marca um perigo naquele ponto.
    mapObj.on('contextmenu', e => reportSheet({ lat: e.latlng.lat, lon: e.latlng.lng }));

    if (bounds.length) mapObj.fitBounds(bounds, { padding: [24, 24] });
    else {
      const all = S.trips.flatMap(t => t.route || []).concat(hzActive().map(h => [h.lat, h.lon]));
      if (all.length) mapObj.fitBounds(all, { padding: [24, 24], maxZoom: 15 });
    }
    hereNow().then(p => {
      if (!mapObj) return;
      L.marker([p.lat, p.lon], { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false }).addTo(mapObj);
      if (!bounds.length) mapObj.setView([p.lat, p.lon], 15);
    }).catch(() => {});
  }).catch(() => {
    if (document.body.contains(box)) box.outerHTML = '<div class="map-msg muted">Sem internet para carregar o mapa. Os avisos continuam funcionando e aparecem aqui quando a conexão voltar.</div>';
  });
}

// Cópia da viagem que vai no post (rota reduzida para no máximo ~400 pontos).
function tripSnapshot(t) {
  const r0 = t.route || [], k = Math.max(1, Math.ceil(r0.length / 400));
  const route = k > 1 ? r0.filter((_, i) => i % k === 0 || i === r0.length - 1) : r0.slice();
  const snap = { tripId: t.id, start: t.start, end: t.end, km: t.km, movingSec: t.movingSec || 0, maxKmh: t.maxKmh || 0, route };
  if (t.breaks?.length) snap.breaks = t.breaks.map(([i, kind]) => [Math.ceil(i / k), kind]);
  return snap;
}
// Reduz a foto da galeria (até 1280 px, JPEG) antes de guardar.
function shrinkPhoto(file) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : no(new Error('foto')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('foto')); };
    img.src = url;
  });
}

function postRouteHTML(post) {
  const t = post.trip; if (!t) return '';
  const media = t.movingSec > 0 ? t.km / (t.movingSec / 3600) : null;
  const meta = `${dia(t.start)}${t.movingSec ? ` · ${durMin(t.movingSec)}` : ''}${media ? `<br>média ${Math.round(media)} km/h` : ''}`;
  const has = t.route?.length > 1;
  return `<button type="button" class="post-route${has ? '' : ' no-route'}" ${has ? `data-route="${esc(post.id)}" aria-label="Ver trajeto de ${fmt(t.km, 2)} km no mapa"` : 'disabled'}>
    ${has ? routeSVG(t.route).replace('viewBox="0 0 52 40"', 'viewBox="0 0 52 40" preserveAspectRatio="xMidYMid meet"') : '<span class="small" style="color:#9AA4AE">Viagem sem trajeto no mapa</span>'}
    <span class="km">${fmt(t.km, 2)}<small>km</small></span><span class="meta">${meta}</span></button>`;
}

const bubbleHTML = m => `<div class="bub ${m.fromId === comMe ? 'me' : 'them'}">${esc(m.text)}<time>${hora(m.createdAt)}</time></div>`;

// Monta a tela da Comunidade (os dados chegam do armazenamento de forma assíncrona).
async function fillCommunity() {
  const token = ++comToken, app = $('#app');
  try {
    comProfiles = await CS.listProfiles();
    if (!comProfiles.some(p => p.id === comMe)) setMe(comProfiles[0].id);
    if (com.view === 'chat' && (!com.other || com.other === comMe)) com.view = 'inbox';
    if (com.view === 'novo' && !com.draft) com.view = 'feed';
    const html = com.view === 'novo' ? viewComNew() : com.view === 'inbox' ? await viewComInbox() : com.view === 'chat' ? await viewComChat() : await viewComFeed();
    if (token !== comToken || tab !== 'comunidade') return;
    app.innerHTML = html;
    bindCommunity(app);
    if (com.view === 'chat') window.scrollTo(0, document.body.scrollHeight);
  } catch (e) {
    if (token === comToken && tab === 'comunidade') app.innerHTML = `<header><h1>Comunidade</h1></header><section class="panel"><p class="muted">Não consegui abrir os dados da Comunidade neste aparelho. ${esc(e.message || '')}</p></section>`;
  }
  updateComBadge();
}
function comGo(view, extra = {}) { Object.assign(com, { view }, extra); fillCommunity(); window.scrollTo(0, 0); }
async function updateComBadge() {
  let n = 0; try { n = await CS.unreadCount(comMe); } catch (e) {}
  const tb = document.querySelector('[data-tab="comunidade"]');
  if (tb) { tb.querySelector('.tab-dot')?.remove(); if (n) tb.insertAdjacentHTML('beforeend', '<span class="tab-dot" aria-hidden="true"></span>'); tb.setAttribute('aria-label', n ? `Comunidade, ${n} mensagens novas` : 'Comunidade'); }
  const b = $('#comUnread'); if (b) { b.hidden = !n; b.textContent = n; }
}
function profileSheet() {
  sheet(`<h2>Perfil de teste</h2>
    <span class="small muted">Use os dois perfis no mesmo iPhone para conferir os dois lados: publicar, curtir e conversar.</span>
    ${comProfiles.map(p => `<button type="button" class="${p.id === comMe ? 'primary' : 'ghost'} block" data-me="${esc(p.id)}" style="justify-content:flex-start">${avatarHTML(p, 30)}${esc(p.name)} <span class="small" style="opacity:.75">@${esc(p.handle || p.id)} · teste</span>${p.id === comMe ? ' ✓' : ''}</button>`).join('')}
    <button type="button" class="linkbtn block" data-clear>Apagar posts, curtidas e mensagens de teste</button>`,
    (el, close) => {
      el.querySelectorAll('[data-me]').forEach(b => b.onclick = () => { setMe(b.dataset.me); close(); if (com.view === 'novo') com.view = 'feed'; fillCommunity(); toast(`Agora você é ${profOf(comMe).name}`); });
      el.querySelector('[data-clear]').onclick = () => { close(); askConfirm('Apagar dados de teste?', 'Some com todos os posts, fotos, curtidas e mensagens da Comunidade deste aparelho. Viagens, recargas e ajustes não mudam.', 'Apagar',
        () => CS.clearAll().then(() => { com = { view: 'feed', other: null, draft: null }; fillCommunity(); toast('Dados de teste apagados'); })); };
    });
}
function routeMapSheet(trip) {
  sheet(`<div class="row between"><h2>${fmt(trip.km, 2)} km</h2><button class="ghost" data-x style="min-height:40px">Fechar</button></div>
    <div id="postMap" style="height:56vh;border-radius:12px;overflow:hidden;background:var(--seg-off)"></div>`, (el, close) => {
    let m = null; const done = () => { try { m?.remove(); } catch (e) {} close(); };
    el.querySelector('[data-x]').onclick = done;
    loadLeaflet().then(() => {
      const box = el.querySelector('#postMap'); if (!box || !document.body.contains(box)) return;
      m = L.map(box, { attributionControl: true });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
      L.polyline(trip.route, { color: '#1B1F24', weight: 8, opacity: .5 }).addTo(m);
      const ln = L.polyline(trip.route, { color: '#9BDB2C', weight: 5 }).addTo(m);
      m.fitBounds(ln.getBounds(), { padding: [20, 20] }); setTimeout(() => m?.invalidateSize(), 250);
    }).catch(() => { const b = el.querySelector('#postMap'); if (b) b.outerHTML = '<p class="muted">Sem internet para carregar o mapa.</p>'; });
  });
}
function bindCommunity(app) {
  const on = (sel, fn) => { const el = app.querySelector(sel); if (el) el.onclick = fn; };
  on('#comProfile', profileSheet);
  on('#comInbox', () => comGo('inbox'));
  on('#comBack', () => comGo(com.view === 'chat' ? 'inbox' : 'feed'));
  on('#comNew', () => comGo('novo', { draft: { tripId: null, photo: null, photoSrc: null, caption: '' } }));
  app.querySelectorAll('[data-photo]').forEach(img => CS.photoUrl(img.dataset.photo).then(u => { if (u) img.src = u; }).catch(() => {}));
  app.querySelectorAll('[data-route]').forEach(b => b.onclick = async () => {
    const p = (await CS.listFeed({ viewerId: comMe })).find(x => x.id === b.dataset.route); if (p?.trip) routeMapSheet(p.trip);
  });
  // Curtir: muda na hora e depois confirma o total guardado.
  app.querySelectorAll('[data-like]').forEach(b => b.onclick = () => {
    const liked = b.getAttribute('aria-pressed') !== 'true', n = b.querySelector('.n'), before = +n.textContent;
    b.setAttribute('aria-pressed', liked); n.textContent = before + (liked ? 1 : -1);
    CS.setLike(b.dataset.like, comMe, liked).then(r => { n.textContent = r.count; })
      .catch(() => { b.setAttribute('aria-pressed', !liked); n.textContent = before; toast('Não consegui salvar a curtida'); });
  });
  app.querySelectorAll('[data-dm]').forEach(b => b.onclick = () => comGo('chat', { other: b.dataset.dm }));
  app.querySelectorAll('[data-chat]').forEach(b => b.onclick = () => comGo('chat', { other: b.dataset.chat }));
  app.querySelectorAll('[data-delpost]').forEach(b => b.onclick = () => askConfirm('Apagar post?', 'Ele sai da Comunidade. A viagem continua no seu histórico.', 'Apagar',
    () => CS.deletePost(b.dataset.delpost, comMe).then(() => { fillCommunity(); toast('Post apagado'); }).catch(e => toast(e.message))));

  // Novo post
  const d = com.draft, refresh = () => {
    const pv = $('#comPreview'); if (pv) pv.innerHTML = draftPreview();
    const pb = $('#comPublish'); if (pb) pb.disabled = !(d.tripId || d.photo);
  };
  app.querySelectorAll('[name="comTrip"]').forEach(r => r.onchange = () => { d.tripId = r.value ? +r.value : null; refresh(); });
  const cap = $('#comCaption'); if (cap) cap.oninput = () => { d.caption = cap.value; refresh(); };
  const ph = $('#comPhoto'); if (ph) ph.onchange = () => {
    const f = ph.files[0]; if (!f) return;
    shrinkPhoto(f).then(b => { if (d.photoSrc) URL.revokeObjectURL(d.photoSrc); d.photo = b; d.photoSrc = URL.createObjectURL(b); fillCommunity(); })
      .catch(() => toast('Não consegui abrir essa foto'));
  };
  on('#comNoPhoto', () => { if (d.photoSrc) URL.revokeObjectURL(d.photoSrc); d.photo = null; d.photoSrc = null; fillCommunity(); });
  on('#comPublish', e => {
    const t = d.tripId && S.trips.find(x => x.id === d.tripId);
    if (!t && !d.photo) { toast('Escolha uma viagem ou uma foto'); return; }
    e.currentTarget.disabled = true;
    CS.createPost({ authorId: comMe, caption: d.caption.trim(), photo: d.photo, trip: t ? tripSnapshot(t) : null })
      .then(() => { if (d.photoSrc) URL.revokeObjectURL(d.photoSrc); com.draft = null; comGo('feed'); toast('Publicado na Comunidade'); })
      .catch(err => { toast(err.message || 'Não consegui publicar'); const pb = $('#comPublish'); if (pb) pb.disabled = false; });
  });

  // Conversa
  const form = $('#chatForm'); if (form) form.onsubmit = ev => {

function chartBuckets() {
  const now = new Date(); const b = [];
  if (chartMode === 'dias') {
    for (let i = 13; i >= 0; i--) { const d = new Date(now); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
      const e = new Date(d); e.setDate(e.getDate() + 1); b.push({ from: +d, to: +e, lab: String(d.getDate()) }); }
  } else if (chartMode === 'semanas') {
    const d0 = new Date(now); d0.setHours(0, 0, 0, 0); d0.setDate(d0.getDate() - ((d0.getDay() + 6) % 7)); // segunda
    for (let i = 11; i >= 0; i--) { const d = new Date(d0); d.setDate(d.getDate() - 7 * i); const e = new Date(d); e.setDate(e.getDate() + 7);
      b.push({ from: +d, to: +e, lab: `${d.getDate()}/${d.getMonth() + 1}` }); }
  } else {
    for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); const e = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      b.push({ from: +d, to: +e, lab: d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '') }); }
  }
  b.forEach(x => x.km = S.trips.filter(t => t.start >= x.from && t.start < x.to).reduce((a, t) => a + t.km, 0));
  return b;
}
function chartSVG() {
  const b = chartBuckets(), W = 340, H = 150, top = 18, bottom = 20, left = 4, right = 4;
  const max = Math.max(1, ...b.map(x => x.km));
  const step = (W - left - right) / b.length, bw = step * 0.62, ih = H - top - bottom;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Quilômetros por período"><line class="axis" x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}"/>`;
  const every = b.length > 12 ? 2 : 1;
  b.forEach((x, i) => {
    const h = x.km / max * ih, xx = left + i * step + (step - bw) / 2, y = H - bottom - h;
    if (x.km > 0) s += `<rect class="bar" x="${xx.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h, 1.5).toFixed(1)}" rx="2"/>`;
    if (x.km > 0 && (x.km === max || b.length <= 12)) s += `<text class="val" x="${(xx + bw / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle">${fmt(x.km, x.km < 10 ? 1 : 0)}</text>`;
    if ((b.length - 1 - i) % every === 0) s += `<text x="${(xx + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(x.lab)}</text>`;
  });
  return s + '</svg>';
}
function routeSVG(r) {
  if (!r || r.length < 2) return '<svg viewBox="0 0 52 40" aria-hidden="true"></svg>';
  const la = r.map(p => p[0]), lo = r.map(p => p[1]);
  const minLa = Math.min(...la), maxLa = Math.max(...la), minLo = Math.min(...lo), maxLo = Math.max(...lo);
  const k = Math.cos(minLa * Math.PI / 180), w = (maxLo - minLo) * k || 1e-6, h = (maxLa - minLa) || 1e-6;
  const sc = Math.min(44 / w, 32 / h), ox = (52 - w * sc) / 2, oy = (40 - h * sc) / 2;
  const d = r.map((p, i) => `${i ? 'L' : 'M'}${(ox + (p[1] - minLo) * k * sc).toFixed(1)} ${(oy + (maxLa - p[0]) * sc).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 52 40" aria-hidden="true"><path d="${d}"/></svg>`;
}

      <div class="trip" style="grid-template-columns:62px 1fr auto">
        ${batteryHTML(c.dashFrom, { mini: true })}
        <div><div class="num" style="font-size:20px">${fmt(chargeKwh(c), 2)} kWh · ${brl(chargeKwh(c) * S.settings.preco)}</div>
        <div class="small muted">${dia(c.date)} · ${hora(c.date)}${c.hours ? ` · ${fmt(c.hours, 1)} h` : ''}</div></div>
        <button class="x" data-delc="${c.id}" aria-label="Apagar recarga">×</button>
      </div>`).join('')}</div>`
    : `<div class="empty"><strong>Nenhuma recarga registrada</strong><span class="small muted">Registre quando colocar a moto pra carregar.</span></div>`}
  </section>`;
}

function viewSettings() {
  const s = S.settings;
  const f = (id, label, val, step, hint = '') => `<div class="field"><label class="label" for="${id}">${label}</label>
    <input id="${id}" data-set="${id}" type="number" inputmode="decimal" step="${step}" value="${val}">${hint ? `<span class="small muted">${hint}</span>` : ''}</div>`;
  return `
  <header><h1>Ajustes</h1></header>
  <section class="panel">
    <h2>Aparência</h2>
    <div class="seg-ctl" role="radiogroup" aria-label="Aparência">
      ${[['claro', 'Claro'], ['escuro', 'Escuro'], ['sistema', 'Sistema']].map(([v, n]) =>
        `<button type="button" role="radio" data-tema="${v}" aria-checked="${s.tema === v}" aria-pressed="${s.tema === v}">${n}</button>`).join('')}
    </div>
    <p class="small muted" style="margin:0">${s.tema === 'sistema' ? 'Segue o claro/escuro do aparelho.' : 'Fica assim mesmo se o aparelho mudar.'} As telas da viagem mantêm o painel grafite.</p>
  </section>
  <section class="panel">
    <h2>Moto</h2>
    <div class="grid2">
      ${f('volts', 'Voltagem (V)', s.volts, 1, 'Carregador 67,2 V = bateria de 60 V')}
      ${f('ah', 'Capacidade (Ah)', s.ah, 1, 'Veja na etiqueta da bateria')}
      ${f('odo', 'Km antes do app', s.odo, 1)}
      ${f('tracos', 'Tracinhos cheia', s.tracos, 1)}
      ${f('autonomiaFab', 'Autonomia de fábrica (km)', s.autonomiaFab, 1, 'Quantos km a moto faz com a carga cheia')}
    </div>
    <p class="note">Bateria de ${fmt(s.volts * s.ah / 1000, 2)} kWh. Se não achar os Ah, deixe 20 (o mais comum nessas motos de 60 V).</p>
  </section>
  <section class="panel">
    <h2>Energia</h2>
    <div class="grid2">
      ${f('preco', 'Preço do kWh (R$)', s.preco, 0.01, 'Está na conta de luz')}
      ${f('kwCarregador', 'Carregador (kW)', s.kwCarregador, 0.01, 'JN-60: até 0,215 kW')}
    </div>
  </section>
  <section class="panel">
    <h2>Backup</h2>
    <p class="small muted">Os dados ficam só neste iPhone. Salve um backup de vez em quando.</p>
    <div class="grid2">
      <button class="ghost" id="exp">Salvar backup</button>
      <label class="btn" style="border:1px solid var(--line);background:transparent" for="imp">Restaurar</label>
    </div>
    <input id="imp" type="file" accept="application/json,.json" hidden>
    <button class="danger block" id="wipe">Apagar tudo</button>
  </section>
  <section class="panel">
    <h2>Sobre o Moto KM</h2>
    <div class="row between"><span class="muted">Versão${NATIVE ? ' (build)' : ''}</span><strong class="num" style="font-size:22px" id="ver">${versionText()}</strong></div>
    <button class="ghost block" id="copyVer">Copiar versão para relatar um problema</button>
  </section>
  <p class="small muted" style="text-align:center">${S.trips.length} viagens · ${S.charges.length} recargas</p>`;
}

/* ---------- Janelas ---------- */
function sheet(html, onBind) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  $('#layer').appendChild(bg);
  onBind(bg.firstElementChild, () => bg.remove());
}
function askConfirm(title, text, okLabel, onOk) {
  sheet(`<h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(text)}</p>
    <div class="grid2"><button class="ghost" data-x>Voltar</button><button class="danger" data-ok>${esc(okLabel)}</button></div>`,
    (el, close) => { el.querySelector('[data-x]').onclick = close; el.querySelector('[data-ok]').onclick = () => { close(); onOk(); }; });
}

/* ---------- Eventos ---------- */
let pick = {};
function bind() {
  const app = $('#app');
  pick = { ini: S.trips[S.trips.length - 1]?.dashEnd ?? S.settings.tracos, chg: 1 };
  bindPickers(app, (n, v) => pick[n] = v);

  $('#go') && ($('#go').onclick = () => startTrip(pick.ini));
  $('#end') && ($('#end').onclick = () => {
    if ($('#layer .sheet-bg')) return;             // já tem uma janela aberta
    sheet(`<h2>Fim da viagem</h2><span class="muted">Quantos tracinhos sobraram?</span>${batteryHTML(S.active.dashStart, { picker: true, name: 'fim' })}
      <button class="primary block" data-ok>Salvar viagem</button><button class="ghost block" data-x>Continuar rodando</button>`,
      (el, close) => { let v = S.active.dashStart; bindPickers(el, (_, x) => v = x);
        el.querySelector('[data-x]').onclick = close; el.querySelector('[data-ok]').onclick = () => { close(); finishTrip(v); }; });
  });
  $('#report') && ($('#report').onclick = () => reportSheet(null));
  $('#pause') && ($('#pause').onclick = pauseTrip);
  $('#closeSummary') && ($('#closeSummary').onclick = () => { summaryId = null; render(); window.scrollTo(0, 0); });
  $('#resume') && ($('#resume').onclick = resumeTrip);
  $('#allTrips') && ($('#allTrips').onclick = () => { mapFocus = null; render(); });
  app.querySelectorAll('[data-trip]').forEach(r => r.onclick = e => {
    if (e.target.closest('button')) return;
    mapFocus = +r.dataset.trip; tab = 'mapa'; render(); window.scrollTo(0, 0);
  });
  if (tab === 'mapa') initMap();
  $('#cancel') && ($('#cancel').onclick = () => askConfirm('Descartar viagem?', 'Os quilômetros desta viagem não serão salvos.', 'Descartar', cancelTrip));
  if (S.active && tab === 'viagem') renderLive();

  app.querySelectorAll('[data-chart]').forEach(b => b.onclick = () => { chartMode = b.dataset.chart; render(); });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => askConfirm('Apagar viagem?', 'Ela sai do relatório e do hodômetro.', 'Apagar', () => {
    S.trips = S.trips.filter(t => t.id !== +b.dataset.del); save(); render(); }));
  app.querySelectorAll('[data-delc]').forEach(b => b.onclick = () => askConfirm('Apagar recarga?', 'Ela sai do custo do mês.', 'Apagar', () => {
    S.charges = S.charges.filter(c => c.id !== +b.dataset.delc); save(); render(); }));

  $('#manual') && ($('#manual').onclick = () => {
    const hoje = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    sheet(`<h2>Viagem manual</h2>
      <div class="grid2"><div class="field"><label class="label" for="mDate">Data</label><input id="mDate" type="date" value="${hoje}"></div>
      <div class="field"><label class="label" for="mKm">Km</label><input id="mKm" type="number" inputmode="decimal" step="0.1" placeholder="Ex.: 12,5"></div></div>
      <span class="label">Bateria na saída</span>${batteryHTML(S.settings.tracos, { picker: true, name: 'ms' })}
      <span class="label">Bateria na chegada</span>${batteryHTML(S.settings.tracos, { picker: true, name: 'me' })}
      <button class="primary block" data-ok>Salvar</button>`,
      (el, close) => { const v = { ms: S.settings.tracos, me: S.settings.tracos }; bindPickers(el, (n, x) => v[n] = x);
        el.querySelector('[data-ok]').onclick = () => {
          const km = parseFloat(String(el.querySelector('#mKm').value).replace(',', '.'));
          if (!(km > 0)) { toast('Digite os quilômetros'); return; }
          const d = el.querySelector('#mDate').value; const start = d ? new Date(d + 'T12:00').getTime() : Date.now();
          S.trips.push({ id: Date.now(), start, end: start, km, movingSec: 0, maxKmh: 0, dashStart: v.ms, dashEnd: v.me, route: [], manual: true });
          save(); close(); render(); toast('Viagem adicionada');
        }; });
  });

  $('#copy') && ($('#copy').onclick = async () => {
    const all = stats(S.trips), mes = stats(inPeriod(S.trips, monthStart()));
    const txt = [`Moto KM · ${new Date().toLocaleDateString('pt-BR')}`, `Hodômetro: ${fmt(S.settings.odo + all.km, 1)} km`,
      `Este mês: ${fmt(mes.km, 1)} km em ${mes.n} viagens`,
      all.kmPorTraco ? `Autonomia: ~${fmt(all.autonomia, 0)} km por carga · ${fmt(all.whKm, 0)} Wh/km · ${brl(all.custoKm)}/km` : 'Consumo: ainda sem dados suficientes'].join('\n');
    try { await navigator.clipboard.writeText(txt); toast('Resumo copiado'); } catch (e) { toast('Não deu pra copiar'); }
  });

  $('#addChg') && ($('#addChg').onclick = () => {
    const h = parseFloat(String($('#chgHours').value).replace(',', '.'));
    S.charges.push({ id: Date.now(), date: Date.now(), dashFrom: pick.chg, hours: h > 0 ? h : null });
    save(); render(); toast('Recarga salva');
  });

  app.querySelectorAll('[data-tema]').forEach(b => b.onclick = () => {
    S.settings.tema = b.dataset.tema; save(); render();
  });
  $('#copyVer') && ($('#copyVer').onclick = () => copyText(`Moto KM ${versionText()} · ${NATIVE ? 'app iPhone' : 'site (PWA)'} · ${navigator.userAgent}`));
  app.querySelectorAll('[data-set]').forEach(i => i.onchange = () => {
    const v = parseFloat(String(i.value).replace(',', '.'));
    if (!(v >= 0)) { toast('Valor inválido'); i.value = S.settings[i.dataset.set]; return; }
    S.settings[i.dataset.set] = i.dataset.set === 'tracos' ? Math.max(1, Math.min(10, Math.round(v))) : v;
    save(); toast('Salvo');
  });
  $('#exp') && ($('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `moto-km-backup-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  $('#imp') && ($('#imp').onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    file.text().then(t => { const d = JSON.parse(t); if (!Array.isArray(d.trips)) throw 0;
      S = { ...JSON.parse(JSON.stringify(DEF)), ...d, settings: { ...DEF.settings, ...(d.settings || {}) }, active: null };
      save(); render(); toast('Backup restaurado'); }).catch(() => toast('Arquivo de backup inválido'));
  });
  $('#wipe') && ($('#wipe').onclick = () => askConfirm('Apagar tudo?', 'Todas as viagens, recargas e ajustes somem deste iPhone. Não tem como desfazer.', 'Apagar tudo', () => {
    S = JSON.parse(JSON.stringify(DEF)); save(); render(); toast('Tudo apagado'); }));
}

/* ---------- Início ---------- */
loadNativeInfo();
render();
if (S.active) {
  S.active.speed = 0; S.active.gps = 'aguardando';  // velocidade e sinal antigos não valem mais
  save(); render();
  setTimeout(beginWatch, 30);
  toast(`${S.active.pausedAt ? 'Viagem pausada' : 'Viagem em andamento retomada'}: ${fmt(S.active.m / 1000, 2)} km`);
}
if (!NATIVE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
try { navigator.storage?.persist?.(); } catch (e) {}
</script>
</body>
</html>
